spring.application.name=task-manager

server.port = 8080

#===============================================================
#DB Configuration
#===============================================================
spring.datasource.url = jdbc:mysql://localhost:3306/taskmanager_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username = root
spring.datasource.password = root
spring.datasource.driver-class-name = com.mysql.cj.jdbc.Driver

spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.idle-timeout=300000          
spring.datasource.hikari.max-lifetime=1800000         
spring.datasource.hikari.connection-timeout=15000     
spring.datasource.hikari.leak-detection-threshold=30000 

#===============================================================
#JPA Configuration
#===============================================================
spring.jpa.properties.hibernate.jdbc.time_zone = UTC
spring.jpa.hibernate.ddl-auto = update
spring.jpa.show-sql = true
spring.jpa.properties.hibernate.format_sql = true

# ============================================
# JWT CONFIGURATION
# ============================================
jwt.secret=${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
jwt.expiration=${JWT_EXPIRATION:86400000}
jwt.pre-auth-expiration=${JWT_PRE_AUTH_EXPIRATION:300000}

# ============================================
# MFA CONFIGURATION
# ============================================
# System MFA Mode: DISABLED, OPTIONAL, MANDATORY
mfa.system.mode=${MFA_SYSTEM_MODE:OPTIONAL}

# Role-based MFA requirements
mfa.role.admin.required=${MFA_ROLE_ADMIN_REQUIRED:true}
mfa.role.user.required=${MFA_ROLE_USER_REQUIRED:false}

# TOTP Settings
mfa.totp.issuer=${MFA_TOTP_ISSUER:TaskManager}
mfa.totp.digits=${MFA_TOTP_DIGITS:6}
mfa.totp.period=${MFA_TOTP_PERIOD:30}

# Backup codes
mfa.backup-codes.count=${MFA_BACKUP_CODES_COUNT:8}
mfa.backup-codes.length=${MFA_BACKUP_CODES_LENGTH:8}

#================================================================
# Audit configuration
#================================================================
audit.fallback.file.path=logs/audit_fallback.log

#================================================================
# Log configuration
#================================================================
logging.level.com.taskmanager=DEBUG
logging.level.org.springframework.security=DEBUG

# Disable Hibernate pool logging (to avoid confusion)
logging.level.org.hibernate.engine.jdbc=WARN

# Enable HikariCP logging
logging.level.com.zaxxer.hikari=DEBUG
